syntax = "proto3";

option csharp_namespace = "Reviews.Grpc";
package reviews;

service ReviewsService {
  rpc GetForProducts (GetForProductsRequest) returns (ReviewsReply);
  rpc GetActivitiesByClient (GetActivitiesByClientRequest) returns (ActivitiesReply);
}

message GetForProductsRequest {
  repeated int64 product_ids = 1;
}

message GetActivitiesByClientRequest {
  int64 client_id = 1;
  int32 page_size = 2;
}

message ReviewItemReply {
  string id = 1;
  int64 product_id = 2;
  string product_name = 3;
  string author_name = 4;
  int32 rating = 5;
  string text = 6;
  string created_at = 7;
}

message ReviewsReply {
  repeated ReviewItemReply items = 1;
}

message ActivityItemReply {
  string id = 1;
  string type = 2;
  string author_name = 3;
  string text = 4;
  int32 rating = 5;
  string outcome = 6;
  string created_at = 7;
}

message ActivitiesReply {
  repeated ActivityItemReply items = 1;
}
