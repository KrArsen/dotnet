services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: labu-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-LabuStrongPassword2026!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-LabuStrongPassword2026!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongodb:
    image: mongo:8
    container_name: labu-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=ActivitiesDb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sqlserver_data:
    name: labu_sqlserver_data
  mongo_data:
    name: labu_mongo_data
